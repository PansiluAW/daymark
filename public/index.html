<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f0">
  <meta name="description" content="Log your gym and nutrition habits, see your progress, and check in with friends.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./circle.css">
  <title>Daymark</title>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M15.5 3.2a4 4 0 0 1 0 7.6"/><circle cx="9" cy="7" r="4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.08A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.08A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.08A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.08A1.65 1.65 0 0 0 19.4 15Z"/></symbol>
    <symbol id="i-gym" viewBox="0 0 24 24"><path d="m6.5 17.5 11-11M4 15l5 5m6-16 5 5M2 17l5 5M17 2l5 5"/></symbol>
    <symbol id="i-diet" viewBox="0 0 24 24"><path d="M20.5 3.5C10 3.5 5 8 5 14a5 5 0 0 0 5 5c6 0 10.5-5 10.5-15.5ZM3 21l9-9"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4.42 0 8-3.58 8-8 0-3.5-2-6-4-7-.25 2.25-1.25 3.5-2 4C14 6 11 3 9 2c.5 3.25-.5 5.5-2 7C5 11 4 12.5 4 15a8 8 0 0 0 8 7Z"/><path d="M12 22a3 3 0 0 0 3-3c0-1.5-1-2.5-2-3-.25 1-1 1.75-2 2 .25-1.25 0-2-.5-2.5C9.5 16.5 9 17.5 9 19a3 3 0 0 0 3 3Z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 15h2m4 0h2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 6 .5l4-4a4 4 0 0 0-5.7-5.7l-2.3 2.3m2 4.9a4 4 0 0 0-6-.5l-4 4a4 4 0 0 0 5.7 5.7l2.3-2.3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 4v3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2 9.6 9.6 2 12l7.6 2.4L12 22l2.4-7.6L22 12l-7.6-2.4L12 2Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h8M4 20l4-.8L20 7.2 16.8 4 4.8 16 4 20Zm10.5-13.7 3.2 3.2"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v7a5 5 0 0 1-10 0V4Zm0 2H3v2a4 4 0 0 0 4 4m10-6h4v2a4 4 0 0 1-4 4m-5 4v4m-4 0h8"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5m-1-8h11m-4-4 4 4-4 4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></symbol>
  </svg>

  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="#dashboard" class="brand" data-view="dashboard" aria-label="Daymark home">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="17" fill="currentColor"/><path fill="#d9fc63" d="M15 36l9-5v17h-9zm12-7 9-5v24h-9zm12-7 9-5v31h-9z"/></svg>
        <span>daymark<span class="brand-period">.</span></span>
      </a>

      <nav class="primary-nav" aria-label="Main navigation">
        <a href="#dashboard" data-view="dashboard" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Today</span></a>
        <a href="#history" data-view="history"><svg class="icon" aria-hidden="true"><use href="#i-activity"/></svg><span>My progress</span></a>
        <a href="#circle" data-view="circle"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg><span>Circle</span></a>
      </nav>

      <div class="header-actions">
        <span class="sync-status" id="sync-status"></span>
        <button class="avatar header-avatar" id="user-avatar" data-view="settings" aria-label="Open profile settings" type="button"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
      </div>
    </div>
  </header>

  <main id="main-content" class="shell" tabindex="-1">
    <div class="site-banner" id="site-banner" role="status" hidden></div>
    <div class="site-banner" id="update-banner" hidden>
      <span role="status">An update is ready.</span>
      <button type="button" class="button button-quiet" data-action="apply-update">Update app</button>
    </div>
    <noscript><div class="site-banner">Enable JavaScript to use Daymark.</div></noscript>

    <section id="view-dashboard" class="view" aria-labelledby="dashboard-heading">
      <div class="page-heading dashboard-heading">
        <h1 id="dashboard-heading">Today</h1>
        <p class="date-label"><time id="today-date"></time></p>
      </div>
      <section class="dashboard-flow" aria-label="Your daily board">
        <div id="today-checkin">
          <div class="daily-card daily-loading" role="status">Opening your board…</div>
        </div>
        <div id="personal-progress"></div>
        <div id="circle-preview"></div>
      </section>
    </section>

    <section id="view-history" class="view" aria-labelledby="history-heading" hidden>
      <div class="page-heading"><h1 id="history-heading">My progress</h1></div>
      <div id="history-content" class="view-content"></div>
    </section>

    <section id="view-circle" class="view" aria-labelledby="circle-heading" hidden>
      <div class="page-heading"><h1 id="circle-heading">Your circle</h1></div>
      <div id="circle-content" class="view-content"></div>
    </section>

    <section id="view-settings" class="view" aria-labelledby="settings-heading" hidden>
      <div class="page-heading"><h1 id="settings-heading">Settings</h1></div>
      <div id="settings-content" class="view-content"></div>
    </section>
  </main>

  <dialog id="app-dialog" class="dialog" aria-labelledby="dialog-title">
    <div id="dialog-content" class="dialog-content"></div>
  </dialog>
  <div id="tap-moment" class="tap-moment" role="status" hidden></div>
  <div id="mark-moment" class="mark-moment" role="status" aria-atomic="true" hidden>
    <div class="mark-moment-card">
      <span class="mark-moment-symbol" aria-hidden="true">✦</span>
      <strong class="mark-moment-title">Day secured!</strong>
      <span class="mark-moment-detail">Your mark is on the board.</span>
      <span class="mark-moment-streak" hidden></span>
    </div>
    <div class="mark-moment-particles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="toast" class="toast" role="status" aria-atomic="true"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
